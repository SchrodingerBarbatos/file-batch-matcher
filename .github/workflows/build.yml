name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller 文件批量匹配复制工具.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBatchMatcher
          path: dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  build-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS app icon (.icns)
        run: |
          set -e
          mkdir -p icon.iconset
          sips -z 16 16     app-icon.png --out icon.iconset/icon_16x16.png       >/dev/null
          sips -z 32 32     app-icon.png --out icon.iconset/icon_16x16@2x.png    >/dev/null
          sips -z 32 32     app-icon.png --out icon.iconset/icon_32x32.png       >/dev/null
          sips -z 64 64     app-icon.png --out icon.iconset/icon_32x32@2x.png    >/dev/null
          sips -z 128 128   app-icon.png --out icon.iconset/icon_128x128.png     >/dev/null
          sips -z 256 256   app-icon.png --out icon.iconset/icon_128x128@2x.png  >/dev/null
          sips -z 256 256   app-icon.png --out icon.iconset/icon_256x256.png     >/dev/null
          sips -z 512 512   app-icon.png --out icon.iconset/icon_256x256@2x.png  >/dev/null
          sips -z 512 512   app-icon.png --out icon.iconset/icon_512x512.png     >/dev/null
          sips -z 1024 1024 app-icon.png --out icon.iconset/icon_512x512@2x.png  >/dev/null
          iconutil -c icns icon.iconset -o app.icns

      - name: Build .app with PyInstaller
        run: pyinstaller --noconfirm --clean 文件批量匹配复制工具.mac.spec

      - name: Ad-hoc code sign
        run: codesign --force --deep -s - "dist/文件批量匹配复制工具.app"

      - name: Create .dmg
        run: |
          hdiutil create -volname "文件批量匹配复制工具" \
            -srcfolder "dist/文件批量匹配复制工具.app" \
            -ov -format UDZO "dist/文件批量匹配复制工具.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBatchMatcher-macos
          path: dist/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
